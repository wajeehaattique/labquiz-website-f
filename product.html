<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REWIND — Camera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">REWIND<span>®</span></div>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="product.html" class="active">CAMERA</a>
            <a href="order.html">ORDER</a>
        </div>

        <a href="order.html" class="nav-button">SHOP NOW →</a>
    </nav>


    <!-- PRODUCT -->
    <main class="product-page">

        <section class="product-section">

            <div class="product-image-container">
                <img
                    id="productImage"
                    src="https://images.unsplash.com/photo-1606986628253-5b7c5b1d5b5b?auto=format&fit=crop&w=1000&q=80"
                    alt="REWIND Retro Digicam"
                >
            </div>


            <div class="product-info">

                <p class="product-label">REWIND MINI</p>

                <h1>THE CAMERA.</h1>

                <p class="product-description">
                    A tiny digital camera made for imperfect,
                    beautiful memories.
                </p>

                <h2 class="product-price">$129.00</h2>


                <!-- COLOR -->
                <div class="color-section">

                    <p>
                        COLOR:
                        <strong id="selectedColor">SILVER</strong>
                    </p>

                    <div class="color-options">

                        <button
                            class="color-button silver selected"
                            data-color="SILVER"
                            aria-label="Silver"
                        ></button>

                        <button
                            class="color-button pink"
                            data-color="PINK"
                            aria-label="Pink"
                        ></button>

                        <button
                            class="color-button black"
                            data-color="BLACK"
                            aria-label="Black"
                        ></button>

                    </div>

                </div>


                <!-- SPECS -->
                <div class="product-specs">

                    <div>
                        <strong>12 MP</strong>
                        <span>CCD SENSOR</span>
                    </div>

                    <div>
                        <strong>1080p</strong>
                        <span>VIDEO</span>
                    </div>

                    <div>
                        <strong>4×</strong>
                        <span>DIGITAL ZOOM</span>
                    </div>

                </div>


                <a href="order.html" class="product-order-button">
                    ORDER NOW — $129 →
                </a>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
